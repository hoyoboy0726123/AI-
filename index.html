<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 辦公自動化 — GUI 截圖</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --border: #2a2f3a;
    --fg: #e8eaed;
    --muted: #9aa0a6;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.6;
  }
  header {
    text-align: center;
    padding: 56px 16px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #181b22 0%, #0f1115 100%);
  }
  header h1 {
    margin: 0 0 8px;
    font-size: clamp(24px, 4vw, 36px);
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 16px 64px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 32px;
  }
  figure {
    margin: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  figcaption {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  figcaption .tag {
    background: var(--accent);
    color: #fff;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  figcaption h2 {
    margin: 0;
    font-size: 18px;
  }
  figcaption .desc {
    color: var(--muted);
    font-size: 13px;
    margin-left: auto;
  }
  img {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
  }
  footer {
    text-align: center;
    color: var(--muted);
    padding: 24px 16px 56px;
    font-size: 13px;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <header>
    <h1>AI 辦公自動化 — 視覺化映射工具 <span style="color:var(--accent)">v3</span></h1>
    <p>UI/UX 重做 · 對應 tab 左右對照 (Excel ↔ Word) · 拖拉欄位到段落直接標注 · 助理對話支援 markdown 與表格渲染</p>
  </header>

  <main>
    <figure>
      <figcaption>
        <span class="tag">01</span>
        <h2>設定</h2>
        <span class="desc">Word 範本 / Excel 數據 / 工作表 / 檔名規則 / 輸出資料夾</span>
      </figcaption>
      <img src="img/01_settings.png" alt="設定分頁">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">02</span>
        <h2>對應 · 左右對照</h2>
        <span class="desc">左:Excel Treeview 預覽真實資料 + 欄位 list (⋮⋮ 拖拉) · 右:Word 段落 style-aware 渲染 (Title / Heading 2 / Normal)</span>
      </figcaption>
      <img src="img/02_mapping.png" alt="對應分頁 — 左右對照">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">02a</span>
        <h2>拖拉中</h2>
        <span class="desc">Drop target 段落黃色高亮 + 浮動 tooltip 跟著游標,顯示要插入的變數名</span>
      </figcaption>
      <img src="img/07_mapping_drag.png" alt="拖拉中:drop target 高亮 + tooltip">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">02b</span>
        <h2>落地後</h2>
        <span class="desc">「客戶名稱:」段落變成「客戶名稱:{{ 客戶名稱 }}」,變數紫字渲染 · 映射歷史記錄一筆</span>
      </figcaption>
      <img src="img/08_mapping_after.png" alt="拖拉落地後:變數已寫入 docx">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">02c</span>
        <h2>全部標完</h2>
        <span class="desc">4 次拖拉完成所有欄位映射 · 映射歷史完整紀錄 · docx 真檔已被改寫</span>
      </figcaption>
      <img src="img/09_mapping_complete.png" alt="全部標完:4 個欄位完成">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">03</span>
        <h2>產出</h2>
        <span class="desc">檢查範本變數 vs Excel 欄位 · 批次產出 · 進度條</span>
      </figcaption>
      <img src="img/03_generate.png" alt="產出分頁">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">04</span>
        <h2>AI 引擎</h2>
        <span class="desc">Gemini Provider · Planner / Reviewer = gemma-4-31b-it · 審查 rubric · 預算上限</span>
      </figcaption>
      <img src="img/04_ai_engine.png" alt="AI 引擎分頁">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">05</span>
        <h2>Agent · 對話流</h2>
        <span class="desc">訊息泡泡 + 角色 badge + 時間戳 · 工具呼叫緊湊樣式 · 助理回覆走 markdown 渲染含真表格</span>
      </figcaption>
      <img src="img/05_agent.png" alt="Agent 對話流(含 markdown 表格)">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">06</span>
        <h2>Agent · 待命狀態</h2>
        <span class="desc">welcome card + 範例 prompt chips(點擊填入)· 狀態 pill(● 待命)</span>
      </figcaption>
      <img src="img/06_agent_welcome.png" alt="Agent 待命狀態(welcome card)">
    </figure>
  </main>

  <footer>
    Source: <a href="https://github.com/hoyoboy0726123/AI-">github.com/hoyoboy0726123/AI-</a>
    · branch <code>claude/office-automation-tool-zvTv9</code>
  </footer>
</body>
</html>
