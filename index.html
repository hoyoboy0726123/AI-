<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 辦公自動化 — GUI 截圖</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --border: #2a2f3a;
    --fg: #e8eaed;
    --muted: #9aa0a6;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.6;
  }
  header {
    text-align: center;
    padding: 56px 16px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #181b22 0%, #0f1115 100%);
  }
  header h1 {
    margin: 0 0 8px;
    font-size: clamp(24px, 4vw, 36px);
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 16px 64px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 32px;
  }
  figure {
    margin: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  figcaption {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  figcaption .tag {
    background: var(--accent);
    color: #fff;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  figcaption h2 {
    margin: 0;
    font-size: 18px;
  }
  figcaption .desc {
    color: var(--muted);
    font-size: 13px;
    margin-left: auto;
  }
  img {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
  }
  footer {
    text-align: center;
    color: var(--muted);
    padding: 24px 16px 56px;
    font-size: 13px;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <header>
    <h1>AI 辦公自動化 — 視覺化映射工具 <span style="color:var(--accent)">v4</span></h1>
    <p>左右對照 · 拖拉標注 · 雙向高亮 · 多 sheet 切換 · 圖片資料夾預覽 · Agent 自然語言處理 messy 資料 · markdown / 表格 渲染</p>
  </header>

  <main>
    <figure>
      <figcaption>
        <span class="tag">01</span>
        <h2>設定</h2>
        <span class="desc">Word 範本 / Excel 數據 / 工作表 / 檔名規則 / 輸出資料夾</span>
      </figcaption>
      <img src="img/01_settings.png" alt="設定分頁">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">02</span>
        <h2>對應 · 左右對照</h2>
        <span class="desc">左:Excel Treeview 預覽真實資料 + 欄位 list (⋮⋮ 拖拉) · 右:Word 段落 style-aware 渲染 (Title / Heading 2 / Normal)</span>
      </figcaption>
      <img src="img/02_mapping.png" alt="對應分頁 — 左右對照">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">02a</span>
        <h2>拖拉中</h2>
        <span class="desc">Drop target 段落黃色高亮 + 浮動 tooltip 跟著游標,顯示要插入的變數名</span>
      </figcaption>
      <img src="img/07_mapping_drag.png" alt="拖拉中:drop target 高亮 + tooltip">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">02b</span>
        <h2>落地後</h2>
        <span class="desc">「客戶名稱:」段落變成「客戶名稱:{{ 客戶名稱 }}」,變數紫字渲染 · 映射歷史記錄一筆</span>
      </figcaption>
      <img src="img/08_mapping_after.png" alt="拖拉落地後:變數已寫入 docx">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">02c</span>
        <h2>全部標完</h2>
        <span class="desc">4 次拖拉完成所有欄位映射 · 映射歷史完整紀錄 · docx 真檔已被改寫</span>
      </figcaption>
      <img src="img/09_mapping_complete.png" alt="全部標完:4 個欄位完成">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">03</span>
        <h2>產出</h2>
        <span class="desc">檢查範本變數 vs Excel 欄位 · 批次產出 · 進度條</span>
      </figcaption>
      <img src="img/03_generate.png" alt="產出分頁">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">04</span>
        <h2>AI 引擎</h2>
        <span class="desc">Gemini Provider · Planner / Reviewer = gemma-4-31b-it · 審查 rubric · 預算上限</span>
      </figcaption>
      <img src="img/04_ai_engine.png" alt="AI 引擎分頁">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">05</span>
        <h2>Agent · 對話流</h2>
        <span class="desc">訊息泡泡 + 角色 badge + 時間戳 · 工具呼叫緊湊樣式 · 助理回覆走 markdown 渲染含真表格</span>
      </figcaption>
      <img src="img/05_agent.png" alt="Agent 對話流(含 markdown 表格)">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">06</span>
        <h2>Agent · 待命狀態</h2>
        <span class="desc">welcome card + 範例 prompt chips(點擊填入)· 狀態 pill(● 待命)</span>
      </figcaption>
      <img src="img/06_agent_welcome.png" alt="Agent 待命狀態(welcome card)">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">07</span>
        <h2>多 sheet 切換</h2>
        <span class="desc">Excel 有多個 sheet 時 OptionMenu 自動出現,切換立刻重抓 Treeview + 欄位 list</span>
      </figcaption>
      <img src="img/10_multisheet.png" alt="多 sheet 切換 — Sheet OptionMenu">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">08</span>
        <h2>切到「供應商」sheet</h2>
        <span class="desc">資料完全換成供應商欄位(供應商名稱/聯絡窗口/電話/交期),欄位 list 同步更新</span>
      </figcaption>
      <img src="img/12_sheet_switched.png" alt="切到供應商 sheet">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">09</span>
        <h2>反向高亮 · Word 變數 → Excel 欄位</h2>
        <span class="desc">點 Word pane 中的 {{ 拜訪日期 }} → 對應左側「拜訪日期」row 自動 scroll 到並黃底橘框 flash 2 秒</span>
      </figcaption>
      <img src="img/11_reverse_highlight.png" alt="反向高亮 — 拜訪日期 row 黃底橘框">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">10</span>
        <h2>圖片資料夾預覽</h2>
        <span class="desc">CTkToplevel 4 欄縮圖 grid · 顯示檔名 + 大小 · 標題列含資料夾路徑與張數</span>
      </figcaption>
      <img src="img/13_image_preview.png" alt="圖片資料夾預覽 — thumbnail grid">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">11</span>
        <h2>Agent E2E · Messy 資料對齊</h2>
        <span class="desc">Word 變數命名與 Excel 對不齊 → Agent 呼 suggest_mappings + rename + insert + 用 replace 把「(待填)」換成變數 + validate 顯示 missing</span>
      </figcaption>
      <img src="img/14_messy_mapping.png" alt="Agent 處理 messy 資料對齊">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">12</span>
        <h2>Agent E2E · 圖片資料夾混雜</h2>
        <span class="desc">5 張圖混雜(2 對應 + 3 雜物) → suggest_image_placements 只配相關的 2 張,主動忽略無關圖 · ask_user 確認後 insert_image_at_anchor × 2</span>
      </figcaption>
      <img src="img/15_messy_images.png" alt="Agent 處理 messy 圖片資料夾">
    </figure>

    <figure>
      <figcaption>
        <span class="tag">13</span>
        <h2>Agent E2E · 反問 + 主動提醒</h2>
        <span class="desc">validate 偵測 {{ 備註 }} 缺對應 Excel 欄 → ask_user 反問是否繼續 · 產出後最終回覆主動加 caveat 並詢問下一步</span>
      </figcaption>
      <img src="img/16_messy_generate.png" alt="Agent 反問 + 產出 + 提醒 caveat">
    </figure>
  </main>

  <footer>
    Source: <a href="https://github.com/hoyoboy0726123/AI-">github.com/hoyoboy0726123/AI-</a>
    · branch <code>claude/office-automation-tool-zvTv9</code>
  </footer>
</body>
</html>
